[package]
name = "branchforge"
version = "0.9.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Graph-first Rust runtime for durable LLM agents"
repository = "https://github.com/junyeong-ai/branchforge"
documentation = "https://github.com/junyeong-ai/branchforge/tree/main/docs"
readme = "README.md"
keywords = ["ai", "agent", "llm", "graph", "runtime"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "^1.49", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "signal"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "http2",
    "multipart",
] }
mime_guess = "2"

# Serialization
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_yaml_bw = "2.5"
schemars = "1.2"
# JSON Schema validator — used by `client::schema::validate` to post-check
# structured-output response bodies against the declared schema with full
# Draft 2020-12 semantics (pattern, format, oneOf, allOf, numeric/length
# constraints). Replaces a hand-rolled walker that conservatively skipped
# these keywords and produced subtle false negatives.
jsonschema = { version = "0.46", default-features = false }

# Async utilities
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# Error handling
thiserror = "2"

# File operations
glob = "0.3"

# Regex
regex = "1"

# URL encoding
url = "2"
urlencoding = "2"

# Layer 2a (local-fs) — TOCTOU-safe file operations, process rlimits.
# Pulled in by the `local-fs` feature. Transitively required by `coding-tools`.
rustix = { version = "1.1", features = ["fs", "process"], optional = true }

# Bash command analysis - AST parsing
tree-sitter = { version = "0.26", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }

# Time
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["time"] }

# Utilities
tracing = "^0.1"
bytes = "^1.11.1"
uuid = { version = "^1.10", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.10"

# Authentication & directories
directories = "6"

# MCP support - optional
rmcp = { version = "1.3", optional = true, features = ["client", "transport-child-process", "client-side-sse", "reqwest", "transport-streamable-http-client-reqwest"] }
http = { version = "1", optional = true }

# AWS Bedrock - optional
aws-config = { version = "^1.8", optional = true }
aws-credential-types = { version = "^1.2", optional = true }
aws-sigv4 = { version = "^1.3", optional = true }
aws-smithy-runtime-api = { version = "^1.9", optional = true }
crc32fast = "1"

# Google Cloud Vertex AI - optional
gcp_auth = { version = "0.12", optional = true }

# Azure AI Foundry - optional
azure_identity = { version = "0.33", optional = true }
azure_core = { version = "0.33", optional = true }

# Credential protection - zeroize-on-drop, redacted Debug
secrecy = { version = "0.10", features = ["serde"] }

# Cron expression parsing - optional
cron = { version = "0.15", optional = true }

# Decimal precision for financial calculations
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
rust_decimal_macros = "1"

# Persistence backends - optional
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "rust_decimal"], optional = true }
redis = { version = "1", features = ["tokio-comp", "connection-manager"], optional = true }

# OpenTelemetry - optional
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["http-proto", "metrics"], optional = true }
opentelemetry-semantic-conventions = { version = "0.31", optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Multimedia support - optional
pdf-extract = { version = "0.10", optional = true }

dashmap = "^6.1"
ahash = "0.8"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Required by examples to disambiguate rustls CryptoProvider when both
# `ring` and `aws-lc-rs` are pulled in transitively.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[features]
# BranchForge is a general-purpose Agent SDK. The default feature set is
# intentionally minimal — `cargo add branchforge` yields a pure Layer 1
# build that runs chat / customer-support / server-side automation agents
# over any of the five built-in codecs (Anthropic Messages, OpenAI Chat,
# OpenAI Responses, Gemini, Bedrock) without pulling in filesystem, shell,
# or cloud-provider dependencies.
#
# Users who want a local filesystem agent (research, knowledge management,
# data analysis) add `features = ["local-fs"]`.
#
# Users who want a full coding agent add `features = ["coding-tools"]`
# (which transitively enables `local-fs`).
#
# See `docs/architecture/layering.md` for the layer contract.
default = ["anthropic-direct"]

# Meta-feature: signals intent to use the Anthropic Messages direct API.
# Pulls in no extra dependencies — the codec and DirectTransport are
# already compiled into Layer 1 unconditionally. This exists so
# `cargo add branchforge` produces a named feature set that communicates
# "ready to call Anthropic out of the box" rather than a bare `default = []`.
anthropic-direct = []

# Layer 2a — Local filesystem tools for general-purpose local agents
# (research, knowledge-management, data-analysis, documentation).
# Enables Read/Write/Edit/Glob/Grep, Workspace, SecureFs (TOCTOU-safe file ops),
# and path-based sandboxing (Landlock/Seatbelt). No shell execution.
# Dependencies: rustix for openat+O_NOFOLLOW and setrlimit plumbing.
local-fs = ["dep:rustix"]

# Layer 2b — Coding agent tools (Bash, KillShell, ProcessScheduler) with
# AST-level bash safety analysis and process-level resource limits.
# Depends on `local-fs` for filesystem access primitives.
coding-tools = ["local-fs", "tree-sitter", "tree-sitter-bash"]

# Agent scheduling and remote triggers
scheduling = ["cron"]

# CLI OAuth authentication source (ClaudeCliProvider, CliCredentials)
cli-auth = []

# File-based resource loaders (DocumentLoader, FileProvider, ChainProvider)
file-resources = []

mcp = ["rmcp", "http"]

# Plugin system with namespace-based resource management
plugins = ["file-resources"]

# Multimedia support for Read tool (PDF, images)
multimedia = ["pdf-extract"]

# Cloud provider integrations
aws = ["aws-config", "aws-credential-types", "aws-sigv4", "aws-smithy-runtime-api"]
gcp = ["gcp_auth"]
azure = ["azure_identity", "azure_core"]

# OpenAI-compatible providers (GPT-4o, o3, Together, Groq, Ollama, vLLM)
openai = []

# Google Gemini API
gemini = []

# All cloud providers
cloud-all = ["aws", "gcp", "azure", "openai", "gemini"]

# Persistence backends
jsonl = []
postgres = ["sqlx"]
redis-backend = ["redis"]
persistence-all = ["jsonl", "postgres", "redis-backend"]

# OpenTelemetry observability
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "tracing-opentelemetry", "tracing-subscriber"]

# Full feature set (excludes multimedia - heavy native dependency, enable separately if needed)
full = ["mcp", "cloud-all", "persistence-all", "otel", "plugins", "cli-auth", "coding-tools", "scheduling"]

[[example]]
name = "advanced_test"
path = "examples/advanced_test.rs"
required-features = ["cli-auth", "file-resources"]

[[example]]
name = "all_tools_test"
path = "examples/all_tools_test.rs"
required-features = ["coding-tools"]

[[example]]
name = "server_tools"
path = "examples/server_tools.rs"
required-features = ["cli-auth", "file-resources"]

[[example]]
name = "sandbox_verification"
path = "examples/sandbox_verification.rs"
required-features = ["coding-tools"]

[[example]]
name = "live_integration_test"
path = "examples/live_integration_test.rs"
required-features = ["cli-auth", "coding-tools", "scheduling"]

[[example]]
name = "deep_integration_test"
path = "examples/deep_integration_test.rs"
required-features = ["cli-auth", "coding-tools"]

[[example]]
name = "structured_output"
path = "examples/structured_output.rs"

# Range-of-scope examples — one per deployment topology the SDK supports.
# Each declares its exact feature requirements so that `cargo build
# --examples --no-default-features [--features ...]` validates that the
# layering contract holds end-to-end (see C9 / docs/architecture/layering.md).

# Pure Layer 1 — customer support bot with a custom knowledge-base tool.
# Runs on the default `anthropic-direct` feature set only; no filesystem,
# no shell, no cloud SDK.
[[example]]
name = "customer_support_agent"
path = "examples/customer_support_agent.rs"

# Pure Layer 1 — host-neutral HTTP API server demonstrating the
# dual-use SDK positioning. Wraps `Agent::execute_stream_into` in a
# minimal `tokio::net::TcpListener` loop with SSE framing via
# `SseSink` and best-effort delivery via `DroppingSink`. No
# framework coupling, no dev-dependencies — shows that the same
# `Agent` that powers a CLI REPL serves HTTP clients unchanged.
# Phase D Workstream D-3.
[[example]]
name = "api_server"
path = "examples/api_server.rs"

# Pure Layer 1 — capability matrix + optional live execution across the
# five built-in codecs. Demonstrates that provider diversity is a
# Layer 1 facility: no feature flags needed.
[[example]]
name = "multi_provider_router"
path = "examples/multi_provider_router.rs"

# Layer 2a (local-fs) — research agent over a markdown notes directory.
# Uses Read/Glob/Grep without ever touching Bash. Good fit for knowledge
# workers, second-brain tools, and literature review.
[[example]]
name = "research_agent"
path = "examples/research_agent.rs"
required-features = ["local-fs"]

# Layer 2a (local-fs) — data analysis agent over a mixed CSV/JSON/JSONL
# dataset. Demonstrates that local-fs is genuinely useful for non-coding
# work; no shell execution is involved.
[[example]]
name = "data_analysis_agent"
path = "examples/data_analysis_agent.rs"
required-features = ["local-fs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
