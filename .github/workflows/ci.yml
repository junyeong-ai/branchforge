name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Grep tool requires ripgrep
      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Run tests
        run: cargo nextest run --all-features --no-fail-fast

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Generate coverage
        run: |
          cargo llvm-cov nextest \
            --all-features \
            --no-fail-fast \
            --lcov \
            --output-path lcov.info \
            --fail-under-lines 0
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  pure-core:
    name: Pure Core Build (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The pure-core build keeps the SDK usable as a minimal LLM client
      # without filesystem, sandbox, or cloud dependencies. Any missing
      # #[cfg(feature = "...")] gate must fail CI before merge.
      - name: Build (no-default-features)
        run: cargo build --lib --no-default-features

      - name: Test (no-default-features, lib only)
        run: cargo test --lib --no-default-features --no-fail-fast

      # Assert that the pure-core dependency closure does NOT pull in
      # heavy feature-gated crates. Any drift fails CI so a missing
      # #[cfg(feature = "...")] gate is caught before merge.
      - name: Dependency closure must not leak feature-gated crates
        run: |
          set -euo pipefail
          tree=$(cargo tree --no-default-features --edges=normal --prefix=none | sort -u)
          forbidden=(rustix tree-sitter tree-sitter-bash aws-config aws-sdk-bedrockruntime gcp_auth azure_identity sqlx redis deadpool-postgres)
          fail=0
          for crate in "${forbidden[@]}"; do
            if echo "$tree" | grep -q "^${crate} "; then
              echo "::error::pure-core build leaked feature-gated crate: $crate"
              fail=1
            fi
          done
          exit $fail

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
