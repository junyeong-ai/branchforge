name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  naming-lint:
    # Enforce the rules declared in .claude/rules/naming.md without waiting
    # for a human reviewer to spot violations. Each audit is a single
    # Python file under scripts/ and fails closed.
    name: Naming & FSM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "#[non_exhaustive] hygiene (open/closed list)"
        run: python3 scripts/audit_non_exhaustive.py

      - name: FSM mutation bypass (transition_to only)
        run: python3 scripts/audit_fsm_bypass.py
